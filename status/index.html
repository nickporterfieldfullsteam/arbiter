<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Status Board — Arbiter</title>
  <link rel="icon" href="../ArbiterLogo_SVG.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #F5F4F0;
      --card-bg: #FFFFFF;
      --border: #E5E5E3;
      --text-primary: #1A1A1A;
      --text-secondary: #888888;
      --text-tertiary: #AAAAAA;
      --col-header-bg: #F0EFEB;
      --accent: #1A1A1A;
      --overdue-bg: #FEF2F2;
      --overdue-border: #FECACA;
      --overdue-text: #A32D2D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); }

    /* Header */
    .header { padding: 24px 32px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { display: flex; align-items: center; gap: 8px; }
    .header-logo svg { width: 28px; height: 28px; }
    .header-title { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
    .header-sub { font-size: 13px; color: var(--text-secondary); }
    .header-meta { font-size: 12px; color: var(--text-tertiary); text-align: right; }

    /* Filter bar */
    .filter-bar { padding: 0 32px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filter-bar select { font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: var(--text-secondary); font-family: inherit; cursor: pointer; }
    .filter-bar select:hover { border-color: #ccc; }
    .filter-clear { font-size: 11px; color: var(--text-tertiary); cursor: pointer; text-decoration: underline; display: none; }
    .filter-clear:hover { color: var(--text-secondary); }

    /* Summary strip */
    .summary-strip { padding: 0 32px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    .summary-chip { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 4px; }
    .summary-chip .dot { width: 6px; height: 6px; border-radius: 50%; }

    /* Board */
    .board { display: flex; gap: 12px; padding: 0 32px 32px; overflow-x: auto; min-height: 300px; }
    .board-col { flex: 1; min-width: 260px; }
    .board-col-header { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-secondary); padding: 8px 12px; background: var(--col-header-bg); border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .board-count { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 1px 7px; font-size: 11px; color: var(--text-tertiary); }
    .board-empty { font-size: 12px; color: var(--text-tertiary); padding: 16px 12px; text-align: center; font-style: italic; }

    /* Progress bar under column header */
    .col-progress { height: 3px; border-radius: 2px; background: var(--border); margin: -4px 0 8px; overflow: hidden; }
    .col-progress-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.3s; }

    /* Cards */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
    .card:hover { border-color: #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .card.expanded { border-color: #bbb; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .card-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .card-meta { font-size: 11px; color: var(--text-tertiary); margin-bottom: 8px; }
    .card-pills { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .card-eta { font-size: 11px; color: var(--text-secondary); }
    .card-eta.overdue { color: var(--overdue-text); font-weight: 500; }
    .card.overdue-card { border-left: 3px solid var(--overdue-text); }

    /* Detail panel inside card */
    .card-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .card-detail.open { display: block; }
    .card-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 10px; }
    .card-detail-label { font-size: 10px; font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
    .card-detail-value { font-size: 12px; color: var(--text-primary); }

    /* Notes in detail */
    .card-notes { margin-top: 8px; }
    .card-notes-title { font-size: 10px; font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .card-note { padding: 6px 8px; background: #FAFAF9; border: 1px solid #eee; border-radius: 6px; border-left: 2px solid #d0d0d0; margin-bottom: 4px; }
    .card-note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .card-note-author { font-size: 10px; font-weight: 500; color: var(--text-secondary); }
    .card-note-time { font-size: 10px; color: var(--text-tertiary); }
    .card-note-body { font-size: 12px; color: var(--text-primary); white-space: pre-wrap; line-height: 1.4; }
    .card-notes-empty { font-size: 11px; color: var(--text-tertiary); font-style: italic; }
    .card-notes-scroll { max-height: 180px; overflow-y: auto; }
    .role-badge { font-size: 8px; border-radius: 3px; padding: 1px 4px; margin-left: 3px; }
    .role-rep { background: #E8F5E9; color: #2E7D32; }
    .role-system { background: #E3F2FD; color: #1565C0; }

    /* Owner avatars */
    .owners-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .owner-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); }

    /* Pills */
    .pill { display: inline-flex; align-items: center; font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }

    /* Owner avatars */
    .avatar { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 8px; font-weight: 500; margin-right: 2px; }

    /* Error / loading states */
    .state-message { text-align: center; padding: 80px 32px; }
    .state-message h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
    .state-message p { font-size: 14px; color: var(--text-secondary); }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--text-primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .header { padding: 16px; }
      .filter-bar { padding: 0 16px 12px; }
      .summary-strip { padding: 0 16px 12px; }
      .board { padding: 0 16px 24px; flex-direction: column; }
      .board-col { min-width: unset; }
    }
  </style>
</head>
<body>

<div id="loading" class="state-message">
  <div class="spinner"></div>
  <p>Loading project status…</p>
</div>

<div id="invalid" class="state-message" style="display:none;">
  <h2>Invalid or expired link</h2>
  <p>This status board link is no longer valid. Please request an updated link from your project manager.</p>
</div>

<div id="app" style="display:none;">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">
        <svg viewBox="0 0 600 520" style="width:28px;height:24px;" xmlns="http://www.w3.org/2000/svg">
          <path d="M299.5,0L300.5,0C312.62,22.206 596.29,514.733 599.999,518.5C599.502,518.555 600.496,519.944 599.999,519.999C586.124,521.54 586.143,519.999 425.5,519.999C402.663,476.501 212.278,153.055 213.74,149.585C215.734,144.853 271.252,51.701 299.5,0Z" style="fill:rgb(35,35,55);"/>
          <path d="M174.5,519.999L1.5,519.999C5.384,505.899 97.29,355.328 96.205,351.588C94.754,346.584 8.021,202.453 11.494,201.478C19.582,199.209 19.75,201.486 116.5,201.486C182.503,201.486 183.471,200.957 185.084,203.744C191.921,215.556 269.754,350.04 270.226,351.582C271.114,354.481 194.017,482.647 174.5,519.999Z" style="fill:rgb(0,199,111);"/>
        </svg>
        <span class="header-title">Project Status</span>
      </div>
    </div>
    <div class="header-meta">
      <div id="board-updated"></div>
      <div id="board-count"></div>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <select id="filter-platform" onchange="renderBoard()"><option value="">All platforms</option></select>
    <select id="filter-status" onchange="renderBoard()"><option value="">All statuses</option></select>
    <select id="filter-priority" onchange="renderBoard()"><option value="">All priorities</option></select>
    <span class="filter-clear" id="filter-clear" onclick="clearFilters()">Clear filters</span>
  </div>

  <div class="summary-strip" id="summary-strip"></div>

  <div class="board" id="board"></div>
</div>

<script>
const SUPABASE_URL = 'https://evjvdfqpsbnpfsmzhpfn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8qsrZAPt5oesXlSNBTJjpA_YjY8OqTk';
const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allProjects = [];
let lifecycleStages = ['Planning', 'Development', 'Testing', 'Releasing'];
let configColors = {}; // label -> { bg, color }
let detailFieldLabels = {}; // field id -> label
let boardToken = '';
let notesCache = {}; // projectId -> [notes]
let expandedCard = null; // currently expanded card id

const AVATAR_COLORS = ['#EEEDFE|#534AB7','#E1F5EE|#0F6E56','#FAECE7|#993C1D','#E6F1FB|#185FA5','#FCE8F3|#9B2C6B'];
const DEFAULT_PILL = { bg: '#F1EFE8', color: '#5F5E5A' };

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  boardToken = params.get('token') || '';

  if (!boardToken) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('invalid').style.display = 'block';
    return;
  }

  // Validate token
  const { data: valid, error: valErr } = await _sb.rpc('validate_status_board_token', { p_token: boardToken });
  if (valErr || !valid) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('invalid').style.display = 'block';
    return;
  }

  // Fetch config colors
  const { data: configData } = await _sb.rpc('get_status_board_config', { p_token: boardToken });
  if (configData && configData.length) {
    const cfg = configData[0];
    // Build a label -> {bg, color} map from all config lists
    [cfg.execution_priorities, cfg.execution_statuses, cfg.execution_lifecycle_stages,
     cfg.execution_sponsor_groups, cfg.execution_platforms].forEach(list => {
      if (Array.isArray(list)) {
        list.forEach(item => {
          if (item.label && item.bg && item.color) configColors[item.label] = { bg: item.bg, color: item.color };
        });
      }
    });
    // Use lifecycle stages from config (preserves order)
    if (Array.isArray(cfg.execution_lifecycle_stages) && cfg.execution_lifecycle_stages.length) {
      lifecycleStages = cfg.execution_lifecycle_stages.map(s => s.label);
    }
    // Build detail field id -> label map
    if (Array.isArray(cfg.detail_fields)) {
      cfg.detail_fields.forEach(f => {
        if (f.id && f.label) detailFieldLabels[f.id] = f.label;
      });
    }
  }

  // Fetch projects
  const { data: projects, error: projErr } = await _sb.rpc('get_status_board_projects', { p_token: boardToken });
  if (projErr) {
    console.error('Failed to load projects:', projErr);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('invalid').style.display = 'block';
    return;
  }

  allProjects = projects || [];

  populateFilters();
  renderSummary();
  renderBoard();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('board-updated').textContent = 'Updated ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function populateFilters() {
  const platforms = [...new Set(allProjects.map(p => p.execution_platform).filter(Boolean))].sort();
  const statuses = [...new Set(allProjects.map(p => p.execution_status).filter(Boolean))].sort();
  const priorities = [...new Set(allProjects.map(p => p.execution_priority).filter(Boolean))].sort();

  fillSelect('filter-platform', platforms, 'All platforms');
  fillSelect('filter-status', statuses, 'All statuses');
  fillSelect('filter-priority', priorities, 'All priorities');
}

function fillSelect(id, values, defaultLabel) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = `<option value="">${defaultLabel}</option>` +
    values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
}

function clearFilters() {
  document.getElementById('filter-platform').value = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-priority').value = '';
  renderBoard();
}

function hasActiveFilters() {
  return (document.getElementById('filter-platform')?.value || '') !== '' ||
         (document.getElementById('filter-status')?.value || '') !== '' ||
         (document.getElementById('filter-priority')?.value || '') !== '';
}

function getFiltered() {
  const fPlatform = document.getElementById('filter-platform')?.value || '';
  const fStatus = document.getElementById('filter-status')?.value || '';
  const fPriority = document.getElementById('filter-priority')?.value || '';
  return allProjects.filter(p => {
    if (fPlatform && p.execution_platform !== fPlatform) return false;
    if (fStatus && p.execution_status !== fStatus) return false;
    if (fPriority && p.execution_priority !== fPriority) return false;
    return true;
  });
}

function renderSummary() {
  const strip = document.getElementById('summary-strip');
  if (!strip) return;

  // Count by status
  const statusCounts = {};
  allProjects.forEach(p => {
    const s = p.execution_status || 'Unset';
    statusCounts[s] = (statusCounts[s] || 0) + 1;
  });

  strip.innerHTML = Object.entries(statusCounts).map(([status, count]) => {
    const c = pillColor(status);
    return `<span class="summary-chip">
      <span class="dot" style="background:${c.color};"></span>
      ${escapeHtml(status)} <strong>${count}</strong>
    </span>`;
  }).join('');
}

function isOverdue(etaStr) {
  if (!etaStr) return false;
  const eta = new Date(etaStr + 'T00:00:00');
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return eta < today;
}

function renderBoard() {
  const filtered = getFiltered();
  const board = document.getElementById('board');
  if (!board) return;

  // Show/hide clear filters link
  const clearBtn = document.getElementById('filter-clear');
  if (clearBtn) clearBtn.style.display = hasActiveFilters() ? 'inline' : 'none';

  document.getElementById('board-count').textContent = filtered.length + ' active project' + (filtered.length !== 1 ? 's' : '');

  const totalProjects = filtered.length || 1; // avoid divide by zero

  board.innerHTML = lifecycleStages.map(stage => {
    const stageProjects = filtered.filter(p => p.execution_lifecycle === stage);
    const pct = Math.round((stageProjects.length / totalProjects) * 100);
    return `
      <div class="board-col">
        <div class="board-col-header">
          ${escapeHtml(stage)}
          <span class="board-count">${stageProjects.length}</span>
        </div>
        <div class="col-progress"><div class="col-progress-fill" style="width:${pct}%;"></div></div>
        ${stageProjects.length ? stageProjects.map(p => renderCard(p)).join('') : '<div class="board-empty">No projects</div>'}
      </div>
    `;
  }).join('');

  // Unassigned column
  const unassigned = filtered.filter(p => !p.execution_lifecycle);
  if (unassigned.length) {
    const pct = Math.round((unassigned.length / totalProjects) * 100);
    board.innerHTML += `
      <div class="board-col">
        <div class="board-col-header">
          Unassigned
          <span class="board-count">${unassigned.length}</span>
        </div>
        <div class="col-progress"><div class="col-progress-fill" style="width:${pct}%;"></div></div>
        ${unassigned.map(p => renderCard(p)).join('')}
      </div>
    `;
  }

  // Re-expand previously expanded card if still visible
  if (expandedCard) {
    const detail = document.getElementById('detail-' + expandedCard);
    const card = document.getElementById('card-' + expandedCard);
    if (detail && card) {
      detail.classList.add('open');
      card.classList.add('expanded');
      loadAndRenderNotes(expandedCard);
    }
  }
}

function renderCard(p) {
  const eta = p.execution_eta ? new Date(p.execution_eta + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
  const overdue = isOverdue(p.execution_eta);
  const sponsorGroup = p.execution_sponsor_group || '';
  const platform = p.execution_platform || '';
  const metaParts = [sponsorGroup, platform].filter(Boolean);

  const owners = p.execution_owners || [];
  const ownerDetails = owners.map((o, i) => {
    const [bg, col] = AVATAR_COLORS[i % AVATAR_COLORS.length].split('|');
    const initials = o.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
    return `<span class="owner-chip"><span class="avatar" style="background:${bg};color:${col};">${initials}</span>${escapeHtml(o)}</span>`;
  }).join('');

  return `
    <div class="card ${overdue ? 'overdue-card' : ''} ${expandedCard === p.id ? 'expanded' : ''}" id="card-${p.id}" onclick="toggleCard('${p.id}')">
      <div class="card-name">${escapeHtml(p.name)}</div>
      ${metaParts.length ? `<div class="card-meta">${escapeHtml(metaParts.join(' · '))}</div>` : ''}
      <div class="card-pills">
        ${p.execution_priority ? makePill(p.execution_priority) : ''}
        ${p.execution_status ? makePill(p.execution_status) : ''}
      </div>
      <div class="card-footer">
        <div class="card-eta ${overdue ? 'overdue' : ''}">${eta ? (overdue ? '⚠ Overdue — ' + eta : 'ETA ' + eta) : ''}</div>
        <div>${renderOwnerAvatars(p.execution_owners)}</div>
      </div>
      <div class="card-detail ${expandedCard === p.id ? 'open' : ''}" id="detail-${p.id}" onclick="event.stopPropagation();">
        <div class="card-detail-grid">
          <div>
            <div class="card-detail-label">Sponsor Group</div>
            <div class="card-detail-value">${escapeHtml(p.execution_sponsor_group) || '—'}</div>
          </div>
          <div>
            <div class="card-detail-label">Platform</div>
            <div class="card-detail-value">${escapeHtml(p.execution_platform) || '—'}</div>
          </div>
          <div>
            <div class="card-detail-label">Priority</div>
            <div class="card-detail-value">${p.execution_priority ? makePill(p.execution_priority) : '—'}</div>
          </div>
          <div>
            <div class="card-detail-label">Status</div>
            <div class="card-detail-value">${p.execution_status ? makePill(p.execution_status) : '—'}</div>
          </div>
          <div>
            <div class="card-detail-label">ETA</div>
            <div class="card-detail-value ${overdue ? 'overdue' : ''}">${eta || '—'}${overdue ? ' <span style="font-size:10px;color:var(--overdue-text);">(overdue)</span>' : ''}</div>
          </div>
          <div>
            <div class="card-detail-label">Lifecycle</div>
            <div class="card-detail-value">${escapeHtml(p.execution_lifecycle) || '—'}</div>
          </div>
        </div>
        ${renderDetailVals(p.detail_vals)}
        ${owners.length ? `
        <div>
          <div class="card-detail-label">Owners</div>
          <div class="owners-row">${ownerDetails}</div>
        </div>` : ''}
        <div class="card-notes" id="notes-${p.id}">
          <div class="card-notes-title">Notes</div>
          <div class="card-notes-scroll" id="notes-scroll-${p.id}">
            <div class="card-notes-empty">Loading…</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderDetailVals(detailVals) {
  if (!detailVals || typeof detailVals !== 'object') return '';
  const entries = Object.entries(detailVals).filter(([k, v]) => v && String(v).trim());
  if (!entries.length) return '';
  return entries.map(([id, value]) => {
    const label = detailFieldLabels[id] || id;
    return `<div style="margin-bottom:8px;">
      <div class="card-detail-label">${escapeHtml(label)}</div>
      <div class="card-detail-value" style="white-space:pre-wrap;">${escapeHtml(String(value))}</div>
    </div>`;
  }).join('');
}

function toggleCard(id) {
  if (expandedCard === id) {
    // Collapse
    const detail = document.getElementById('detail-' + id);
    const card = document.getElementById('card-' + id);
    if (detail) detail.classList.remove('open');
    if (card) card.classList.remove('expanded');
    expandedCard = null;
  } else {
    // Collapse previous
    if (expandedCard) {
      const prevDetail = document.getElementById('detail-' + expandedCard);
      const prevCard = document.getElementById('card-' + expandedCard);
      if (prevDetail) prevDetail.classList.remove('open');
      if (prevCard) prevCard.classList.remove('expanded');
    }
    // Expand new
    const detail = document.getElementById('detail-' + id);
    const card = document.getElementById('card-' + id);
    if (detail) detail.classList.add('open');
    if (card) card.classList.add('expanded');
    expandedCard = id;
    loadAndRenderNotes(id);
  }
}

async function loadAndRenderNotes(projectId) {
  const container = document.getElementById('notes-scroll-' + projectId);
  if (!container) return;

  // Check cache first
  if (notesCache[projectId]) {
    renderNotes(container, notesCache[projectId]);
    return;
  }

  container.innerHTML = '<div class="card-notes-empty">Loading…</div>';

  const { data, error } = await _sb.rpc('get_status_board_notes', {
    p_token: boardToken,
    p_project_id: projectId,
  });

  if (error) {
    console.warn('Failed to load notes:', error);
    container.innerHTML = '<div class="card-notes-empty">Unable to load notes.</div>';
    return;
  }

  notesCache[projectId] = data || [];
  renderNotes(container, notesCache[projectId]);
}

function renderNotes(container, notes) {
  if (!notes.length) {
    container.innerHTML = '<div class="card-notes-empty">No notes yet.</div>';
    return;
  }
  container.innerHTML = notes.map(n => {
    const ts = new Date(n.created_at);
    const timeStr = ts.toLocaleDateString() + ' ' + ts.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const roleBadge = n.author_role === 'rep' ? '<span class="role-badge role-rep">Rep</span>' :
                      n.author_role === 'system' ? '<span class="role-badge role-system">System</span>' : '';
    // Clean up author name: if it looks like an email, show just the name part
    let displayName = n.author_name || 'Unknown';
    if (displayName.includes('@')) {
      displayName = displayName.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }
    return `<div class="card-note">
      <div class="card-note-header">
        <span class="card-note-author">${escapeHtml(displayName)}${roleBadge}</span>
        <span class="card-note-time">${timeStr}</span>
      </div>
      <div class="card-note-body">${escapeHtml(n.body)}</div>
    </div>`;
  }).join('');
}

function pillColor(label) {
  // Use config colors if available, otherwise fall back to defaults
  if (configColors[label]) return configColors[label];
  // Hardcoded fallbacks for common values
  const fallback = {
    'On Track':    { bg: '#E1F5EE', color: '#0F6E56' },
    'At Risk':     { bg: '#FAEEDA', color: '#854F0B' },
    'Blocked':     { bg: '#FCEBEB', color: '#A32D2D' },
    'Needs Info':  { bg: '#E6F1FB', color: '#185FA5' },
  };
  if (fallback[label]) return fallback[label];
  const lower = (label || '').toLowerCase();
  if (lower.includes('critical') || lower.includes('asap')) return { bg: '#FCEBEB', color: '#A32D2D' };
  if (lower.includes('high')) return { bg: '#FAECE7', color: '#993C1D' };
  return DEFAULT_PILL;
}

function makePill(label) {
  const c = pillColor(label);
  return `<span class="pill" style="background:${c.bg};color:${c.color};">${escapeHtml(label)}</span>`;
}

function renderOwnerAvatars(owners) {
  if (!owners?.length) return '';
  return owners.slice(0, 3).map((o, i) => {
    const [bg, col] = AVATAR_COLORS[i % AVATAR_COLORS.length].split('|');
    const initials = o.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
    return `<span class="avatar" title="${escapeHtml(o)}" style="background:${bg};color:${col};">${initials}</span>`;
  }).join('') + (owners.length > 3 ? `<span style="font-size:11px;color:var(--text-tertiary);">+${owners.length - 3}</span>` : '');
}

init();
</script>
</body>
</html>
